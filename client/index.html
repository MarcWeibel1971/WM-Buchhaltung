  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <!-- Audit P2-9: Umami nur laden, wenn die Env-Variablen gesetzt sind.
         Ohne Konfiguration blieb der %VITE_*%-Platzhalter unreplaced stehen und
         erzeugte bei jedem Seitenaufruf einen Request ins Leere (500er im Log). -->
    <script>
      (function () {
        var endpoint = "%VITE_ANALYTICS_ENDPOINT%";
        var websiteId = "%VITE_ANALYTICS_WEBSITE_ID%";
        if (!endpoint || endpoint.charAt(0) === "%" || !websiteId || websiteId.charAt(0) === "%") return;
        var s = document.createElement("script");
        s.defer = true;
        s.src = endpoint.replace(/\/$/, "") + "/umami";
        s.setAttribute("data-website-id", websiteId);
        document.head.appendChild(s);
      })();
    </script>
  </body>

</html>
