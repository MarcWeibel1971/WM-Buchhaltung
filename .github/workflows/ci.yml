name: CI



on:

  push:
  
    branches: [main]
    
  pull_request:
  
    branches: [main]
    


jobs:

  check-test-build:
  
    runs-on: ubuntu-latest
    
    steps:
    
      - uses: actions/checkout@v7
      


      - uses: pnpm/action-setup@v6
      


      - uses: actions/setup-node@v7
      
        with:
        
          node-version: 20
          
          cache: pnpm
          


      - name: Install dependencies
      
        run: pnpm install --frozen-lockfile
        


      - name: Typecheck
      
        run: pnpm check
        


      - name: Tests
      
        run: pnpm test
        


      - name: Test coverage
      
        run: pnpm test:coverage
        


      - name: Build
      
        run: pnpm build
        























