version: 2
updates:
  # npm-Abhängigkeiten (Root: client + server + shared via Workspaces)
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
    open-pull-requests-limit: 5
    versioning-strategy: increase
    labels:
      - "dependencies"
    groups:
      # Kleinteilige Patch-Updates bündeln, Major einzeln reviewen
      patch-updates:
        update-types: ["patch"]
      minor-updates:
        update-types: ["minor"]

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
      - "ci"
